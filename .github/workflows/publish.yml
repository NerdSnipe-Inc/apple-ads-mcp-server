name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write  # required for GitHub Packages
  id-token: write  # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "Version match: $PKG"

      # ── Publish to npmjs.com ──────────────────────────────────────────────────

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no long-lived NPM_TOKEN is used.
      - run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run generate:check
      - run: npm run build
      - run: npm test

      # Authenticates via GitHub OIDC (id-token: write) against the Trusted Publisher
      # configured for this package on npmjs.com. Provenance is attached automatically.
      - name: Publish to npmjs.com
        run: npm publish --access public

      # ── Publish to GitHub Packages ────────────────────────────────────────────

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nerdsnipe-inc'

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
